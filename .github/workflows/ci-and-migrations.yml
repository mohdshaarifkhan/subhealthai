# CI + automatic Supabase migrations.
#
# On every push to feature/productEnhancement (or a manual run):
#   1. test:     install, type-check, unit tests.
#   2. migrate:  only if tests pass AND files under supabase/migrations/ changed
#                (or on manual run): dry run, then `supabase db push` the
#                pending migrations to the live project.
#
# One-time setup (GitHub repo → Settings → Secrets and variables → Actions):
#   SUPABASE_DB_URL  the same value as DATABASE_URL in .env.local
#                    (Supabase → Project Settings → Database → connection string)
# Without it the migrate job skips with a notice instead of failing.
name: CI and migrations

on:
  push:
    branches: [feature/productEnhancement]
  workflow_dispatch:

concurrency:
  group: supabase-migrations
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    outputs:
      migrations_changed: ${{ steps.changes.outputs.migrations }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - id: changes
        name: Detect migration changes
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "migrations=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" 2>/dev/null | grep -q '^supabase/migrations/'; then
            echo "migrations=true" >> "$GITHUB_OUTPUT"
          else
            echo "migrations=false" >> "$GITHUB_OUTPUT"
          fi

  migrate:
    needs: test
    if: needs.test.outputs.migrations_changed == 'true'
    runs-on: ubuntu-latest
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: Check secret
        id: secrets
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::notice::SUPABASE_DB_URL not set; skipping migrations."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: supabase/setup-cli@v1
        if: steps.secrets.outputs.ready == 'true'
        with:
          version: latest
      - name: Pending migrations (dry run)
        if: steps.secrets.outputs.ready == 'true'
        run: supabase db push --db-url "$SUPABASE_DB_URL" --dry-run
      - name: Apply migrations
        if: steps.secrets.outputs.ready == 'true'
        run: supabase db push --db-url "$SUPABASE_DB_URL"
      - name: Show migration history
        if: steps.secrets.outputs.ready == 'true'
        run: supabase migration list --db-url "$SUPABASE_DB_URL"
